name: FarmMobile
options:
  bundleIdPrefix: io.github.ccpopy
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
targets:
  FarmMobile:
    type: application
    platform: iOS
    sources:
      - path: FarmMobile
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.ccpopy.farmmobile
        PRODUCT_NAME: FarmMobile
        INFOPLIST_FILE: FarmMobile/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: FarmMobile/FarmMobile.entitlements
        ENABLE_PREVIEWS: YES
        SWIFT_STRICT_CONCURRENCY: minimal
