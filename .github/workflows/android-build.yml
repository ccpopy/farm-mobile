name: Android Release APK

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build-apk:
    name: Build Release APK
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.apk.outputs.version }}
      digest: ${{ steps.apk.outputs.digest }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Check and assemble Release APK
        run: gradle lintRelease assembleRelease --no-daemon

      - name: Sign and verify Release APK
        id: apk
        shell: bash
        env:
          ANDROID_RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
          ANDROID_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEYSTORE_PASSWORD }}
        run: |
          if [[ -z "$ANDROID_RELEASE_KEYSTORE_BASE64" || -z "$ANDROID_RELEASE_KEYSTORE_PASSWORD" ]]; then
            echo "::error::Android release signing secrets are missing."
            exit 1
          fi

          output_dir=app/build/outputs/apk/release
          unsigned_apk="$output_dir/app-release-unsigned.apk"
          build_tools="$ANDROID_HOME/build-tools/35.0.0"
          badging="$("$build_tools/aapt" dump badging "$unsigned_apk")"
          package_info="$(sed -n '/^package:/p' <<< "$badging")"
          echo "$package_info"
          version="$(sed -n "s/.*versionName='\([^']*\)'.*/\1/p" <<< "$package_info")"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ || "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "::error::APK version must match the v version tag."
            exit 1
          fi
          if [[ "$package_info" != "package: name='io.github.ccpopy.farmmobile' "* ]] || grep -q '^application-debuggable' <<< "$badging"; then
            echo "::error::Expected a non-debuggable io.github.ccpopy.farmmobile APK."
            exit 1
          fi

          keystore="$(mktemp "$RUNNER_TEMP/android-release.XXXXXXXX")"
          trap 'rm -f "$keystore"' EXIT
          printf '%s' "$ANDROID_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$keystore"
          aligned_apk="$RUNNER_TEMP/android-release-aligned.apk"
          apk="$output_dir/farm-mobile-$version-release.apk"
          "$build_tools/zipalign" -f -P 16 4 "$unsigned_apk" "$aligned_apk"
          "$build_tools/apksigner" sign --ks "$keystore" --ks-type PKCS12 --ks-key-alias farm-mobile \
            --ks-pass env:ANDROID_RELEASE_KEYSTORE_PASSWORD --key-pass env:ANDROID_RELEASE_KEYSTORE_PASSWORD \
            --out "$apk" "$aligned_apk"
          "$build_tools/apksigner" verify --print-certs "$apk"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "digest=sha256:$(sha256sum "$apk" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Upload Release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: farm-mobile-${{ steps.apk.outputs.version }}-release
          path: app/build/outputs/apk/release/farm-mobile-${{ steps.apk.outputs.version }}-release.apk
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    needs: build-apk
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download signed APK
        uses: actions/download-artifact@v6
        with:
          name: farm-mobile-${{ needs.build-apk.outputs.version }}-release

      - name: Publish signed APK
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.build-apk.outputs.version }}
          APK_DIGEST: ${{ needs.build-apk.outputs.digest }}
        run: |
          tag="v$RELEASE_VERSION"
          apk="farm-mobile-$RELEASE_VERSION-release.apk"
          digest="sha256:$(sha256sum "$apk" | cut -d' ' -f1)"
          if [[ "$digest" != "$APK_DIGEST" ]]; then
            echo "::error::Downloaded APK does not match the signed build artifact."
            exit 1
          fi

          if release="$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft,isPrerelease,assets 2>/dev/null)"; then
            if jq -e '(.isDraft | not) and .isPrerelease' <<< "$release" > /dev/null; then
              echo "::error::The tag already has a published prerelease."
              exit 1
            fi
            existing="$(jq -r --arg apk "$apk" '.assets[] | select(.name == $apk) | (.digest // "missing")' <<< "$release")"
            if [[ -z "$existing" ]]; then
              gh release upload "$tag" "$apk" --repo "$GITHUB_REPOSITORY"
            elif [[ "$existing" != "$digest" ]]; then
              echo "::error::The existing Release APK differs from the signed build artifact."
              exit 1
            fi
            if jq -e '.isDraft' <<< "$release" > /dev/null; then
              gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease=false --verify-tag --latest
            fi
          else
            tag_object="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" --jq '.object | select(.type == "tag") | .sha')"
            if [[ -z "$tag_object" ]]; then
              echo "::error::Push an annotated version tag containing the release notes."
              exit 1
            fi
            gh api "repos/$GITHUB_REPOSITORY/git/tags/$tag_object" --jq '.message' > release-notes.md
            gh release create "$tag" "$apk" \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --title "Farm Mobile v$RELEASE_VERSION" \
              --notes-file release-notes.md \
              --latest
          fi
